name: Principle completeness audit and task dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:
      - "data/formalism-worker-registry.json"
      - "data/formalism-task-claims.json"
      - "schemas/formalism-task-state.schema.json"
      - "scripts/audit_formalism_coherence.py"
      - "scripts/dispatch_formalism_tasks.py"
      - "tests/test_dispatch_formalism_tasks.py"
      - "tests/test_principle_completeness.py"
      - "docs/PRINCIPLE_COMPLETENESS_STANDARD.md"
      - "docs/PRINCIPLE_COMPLETENESS_MIRROR_HANDOFF.md"
      - ".github/workflows/formalism-coherence-audit.yml"

permissions:
  contents: write

concurrency:
  group: principle-completeness-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out coordination repository
        uses: actions/checkout@v4

      - name: Validate worker files
        run: |
          python -m py_compile scripts/audit_formalism_coherence.py scripts/dispatch_formalism_tasks.py
          python -m json.tool data/formalism-worker-registry.json >/dev/null
          python -m json.tool data/formalism-task-claims.json >/dev/null
          python -m json.tool schemas/formalism-task-state.schema.json >/dev/null
          python -m unittest discover -s tests -v

      - name: Run fail-closed organization completeness audit
        id: audit
        env:
          STEGVERSE_WORKER_TOKEN: ${{ secrets.STEGVERSE_WORKER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/audit_formalism_coherence.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate completeness evidence
        run: |
          test -f reports/principle-completeness-latest.json
          test -f reports/principle-completeness-latest.md
          test -f reports/formalism-coherence-latest.json
          python -m json.tool reports/principle-completeness-latest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/principle-completeness-latest.json').read_text())
          assert report['schema_version'] == '2.0.0'
          assert report['repository_count'] >= 31, report['repository_count']
          assert report['dimension_count'] == 12
          assert report['publication_authorized'] is False
          names = {row['repository'] for row in report['repositories']}
          assert 'Admissible-Existence/.github' in names
          assert 'Admissible-Existence/AE' in names
          PY

      - name: Derive durable repository task states
        run: |
          python scripts/dispatch_formalism_tasks.py
          test -f reports/formalism-task-state-latest.json
          python -m json.tool reports/formalism-task-state-latest.json >/dev/null

      - name: Persist latest audit and task state
        run: |
          git config user.name "admissible-existence-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/principle-completeness-latest.json \
            reports/principle-completeness-latest.md \
            reports/formalism-coherence-latest.json \
            reports/formalism-task-state-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record principle completeness audit and task state"
            git push
          fi

      - name: Upload worker evidence
        uses: actions/upload-artifact@v4
        with:
          name: principle-completeness-and-task-state
          path: |
            reports/principle-completeness-latest.json
            reports/principle-completeness-latest.md
            reports/formalism-coherence-latest.json
            reports/formalism-task-state-latest.json
          if-no-files-found: error

      - name: Enforce fail-closed completeness result
        if: steps.audit.outputs.status != '0'
        run: |
          echo "One or more repositories remain below the principle-completeness standard."
          echo "Durable gap evidence and task state were persisted before this fail-closed result."
          exit 1
