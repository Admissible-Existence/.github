name: STCM CHF pinned native baselines — validation only

on:
  pull_request:
    paths:
      - 'research/stcm-chf-witness/**'
      - '.github/workflows/validate-stcm-chf-native-baselines.yml'
  workflow_dispatch:

permissions: {}

jobs:
  independent-source-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Anonymous comparison repository checkout
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          git init .
          git remote add origin https://github.com/Admissible-Existence/.github.git
          if [ -n "${PR_NUMBER:-}" ]; then
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            env -u GITHUB_TOKEN -u GH_TOKEN git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --detach FETCH_HEAD
      - name: Acquire immutable native-source baselines read-only
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-stcm" "${RUNNER_TEMP}/source-chf"
          git -C "${RUNNER_TEMP}/source-stcm" init
          git -C "${RUNNER_TEMP}/source-stcm" remote add origin https://github.com/Admissible-Existence/STCM.git
          env -u GITHUB_TOKEN -u GH_TOKEN git -C "${RUNNER_TEMP}/source-stcm" fetch --depth=1 origin 92f6bb8ac61377792970da16a835430ebe20f000
          git -C "${RUNNER_TEMP}/source-stcm" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/source-chf" init
          git -C "${RUNNER_TEMP}/source-chf" remote add origin https://github.com/Admissible-Existence/CHF.git
          env -u GITHUB_TOKEN -u GH_TOKEN git -C "${RUNNER_TEMP}/source-chf" fetch --depth=1 origin 369737c3ca1985cd9b1e0a2696ebfbc7ecb84b93
          git -C "${RUNNER_TEMP}/source-chf" checkout --detach FETCH_HEAD
      - name: Execute the two native baseline validations independently
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          python3 research/stcm-chf-witness/validate_pinned_native_sources.py \
            --stcm-root "${RUNNER_TEMP}/source-stcm" \
            --chf-root "${RUNNER_TEMP}/source-chf" \
            --report "${RUNNER_TEMP}/stcm-chf-native-source-validation.json"
      - name: Retain validation-only native source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-native-source-baseline-report
          path: ${{ runner.temp }}/stcm-chf-native-source-validation.json
          if-no-files-found: warn
