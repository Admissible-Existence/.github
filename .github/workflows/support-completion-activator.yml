name: Support completion activator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/*-completion-evidence.json'
      - 'scripts/activate_support_completions.py'
      - '.github/workflows/support-completion-activator.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate validated support evidence
        run: |
          python -m py_compile scripts/activate_support_completions.py
          python scripts/activate_support_completions.py
          python -m json.tool data/formalism-worker-registry.json >/dev/null
          python -m json.tool data/cross-repository-remediation-registry.json >/dev/null
          python -m json.tool reports/support-completion-activation-latest.json >/dev/null

      - name: Persist activation state
        run: |
          git config user.name "admissible-existence-support-activator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/formalism-worker-registry.json data/cross-repository-remediation-registry.json reports/support-completion-activation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Activate validated support completion"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: support-completion-activation
          path: reports/support-completion-activation-latest.json
          if-no-files-found: error
