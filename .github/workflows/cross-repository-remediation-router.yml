name: Cross-repository remediation router

on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
  push:
    branches: [main]
    paths:
      - 'data/formalism-worker-registry.json'
      - 'data/cross-repository-remediation-registry.json'
      - 'scripts/route_cross_repository_remediation.py'
      - 'tests/test_cross_repository_remediation_router.py'
      - '.github/workflows/cross-repository-remediation-router.yml'

permissions:
  contents: write

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate router contract
        run: |
          python -m py_compile scripts/route_cross_repository_remediation.py
          python -m pytest -q tests/test_cross_repository_remediation_router.py
          python -m json.tool data/cross-repository-remediation-registry.json >/dev/null
      - name: Route repositories
        run: |
          python scripts/route_cross_repository_remediation.py
          python -m json.tool reports/cross-repository-remediation-latest.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/cross-repository-remediation-latest.json').read_text())
          expected = {
              'CONTROL_PLANE': 1,
              'DIRECT_SOURCE_UPDATE': 9,
              'DIRECT_SUPPORT_UPDATE': 6,
              'DISPOSITION_REQUIRED': 2,
              'OBSERVE_NOTIFY_ONLY': 1,
              'COMPLETE_NOTIFY_ONLY': 6,
              'INTEGRATION_NOTIFY_ONLY': 1,
              'HOSTED_VALIDATION_BLOCKED': 6,
          }
          if report['counts'] != expected:
              raise SystemExit(f"routing counts mismatch: {report['counts']} != {expected}")
          if len(report['repositories']) != 32:
              raise SystemExit(f"expected 32 repositories, got {len(report['repositories'])}")
          by_repo = {row['repository']: row for row in report['repositories']}
          required_states = {
              'Admissible-Existence/GTG': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/ET': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/DC': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/Existence': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/Triad': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/GCAT-BCAT': 'COMPLETE_NOTIFY_ONLY',
              'Admissible-Existence/TT': 'INTEGRATION_NOTIFY_ONLY',
              'Admissible-Existence/STCM': 'HOSTED_VALIDATION_BLOCKED',
              'Admissible-Existence/learning-transition-governance': 'HOSTED_VALIDATION_BLOCKED',
              'Admissible-Existence/BC': 'HOSTED_VALIDATION_BLOCKED',
              'Admissible-Existence/CHF': 'HOSTED_VALIDATION_BLOCKED',
              'Admissible-Existence/RE': 'HOSTED_VALIDATION_BLOCKED',
              'Admissible-Existence/RE-Reduction': 'HOSTED_VALIDATION_BLOCKED',
          }
          for repo, state in required_states.items():
              if by_repo[repo]['routing_state'] != state:
                  raise SystemExit(f"{repo} must remain {state}")
              if not by_repo[repo]['completion_evidence']:
                  raise SystemExit(f"{repo} requires completion evidence")
          PY
      - name: Persist routing report
        run: |
          mkdir -p /tmp/aex-routing
          cp reports/cross-repository-remediation-latest.json /tmp/aex-routing/
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cp /tmp/aex-routing/cross-repository-remediation-latest.json reports/
          git config user.name "admissible-existence-remediation-router"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cross-repository-remediation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record cross-repository remediation routing"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cross-repository-remediation-routing
          path: reports/cross-repository-remediation-latest.json
