name: Validate COSV Projection

on:
  pull_request:
    paths:
      - "data/cosv/**"
      - "data/formalism-task-claims.json"
      - "data/principle-completeness-worker-claim.json"
      - "data/principle-worker-activation-observer-claim.json"
      - "data/cross-repository-remediation-registry.json"
      - "data/task-states/verfi-external-formalism.json"
      - "HEARTBEAT_RESPONSE_MIRROR_HANDOFF.md"
      - "docs/MATHEMATICAL_COMPLETENESS_MIRROR_HANDOFF.md"
      - "docs/CROSS_REPOSITORY_REMEDIATION_MIRROR_HANDOFF.md"
      - "scripts/check_cosv_task_projection.py"
      - ".github/workflows/validate-cosv-projection.yml"
  push:
    branches: [main]
    paths:
      - "data/cosv/**"
      - "data/formalism-task-claims.json"
      - "data/principle-completeness-worker-claim.json"
      - "data/principle-worker-activation-observer-claim.json"
      - "data/cross-repository-remediation-registry.json"
      - "data/task-states/verfi-external-formalism.json"
      - "HEARTBEAT_RESPONSE_MIRROR_HANDOFF.md"
      - "docs/MATHEMATICAL_COMPLETENESS_MIRROR_HANDOFF.md"
      - "docs/CROSS_REPOSITORY_REMEDIATION_MIRROR_HANDOFF.md"
      - "scripts/check_cosv_task_projection.py"
      - ".github/workflows/validate-cosv-projection.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_cosv_task_projection.py
