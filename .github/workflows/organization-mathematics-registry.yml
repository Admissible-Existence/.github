name: Organization mathematics registry validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/ORGANIZATION_MATHEMATICAL_ARCHITECTURE.md"
      - "data/organization-mathematics-registry.yaml"
      - "scripts/validate_organization_mathematics.py"
      - ".github/workflows/organization-mathematics-registry.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate registry
        run: |
          python -m py_compile scripts/validate_organization_mathematics.py
          python scripts/validate_organization_mathematics.py
          python -m json.tool reports/organization-mathematics-validation.json >/dev/null

      - name: Persist validation receipt
        run: |
          git config user.name "admissible-existence-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/organization-mathematics-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Record organization mathematics validation"
            git push
          fi

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: organization-mathematics-validation
          path: reports/organization-mathematics-validation.json
          if-no-files-found: error
