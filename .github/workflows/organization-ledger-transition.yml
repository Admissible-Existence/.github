name: Organization Ledger Transition

# A committed request runs one intr-destination diagnostic self-closure
# (B-P40 COMMITTED_REQUEST): a push to main that commits
# data/requests/organization-ledger-transition.json, which declares the
# communication_id and the supplied hb_epoch. There is no manual dispatch and
# no clock; the request is the only input, and its sha256 is bound into the
# self-closure's packet id, so both receipts record which request ran.
# The closure appends a repository receipt and an organization receipt, both
# carrying communication_id, to refs/stegverse/organization-ledger
# (org-contract.json organization_ledger_ref). The ref is published by a
# fast-forward-only push and read back from a fresh fetch. The ledger is the
# evidence. Authority and time are constraint variables. The disposition is
# transition evidence only.
on:
  push:
    branches: [main]
    paths:
      - "data/requests/organization-ledger-transition.json"

permissions:
  contents: write

# ORGANIZATION_LEDGER_LOCK: one appender at a time. The push below is the
# compare-and-swap against the published ref, so a writer that lost the race
# fails closed instead of overwriting.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate the designated ref and the readback before any append
        run: |
          python -m py_compile resident-runtime/organization_ledger_readback.py resident-runtime/intr_destination_ingress.py resident-runtime/ledger_store.py resident-runtime/aggregate_repo_transition.py .stegverse/transition-ledger/emit.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          assert contract["organization"] == "Admissible-Existence"
          assert contract["organization_ledger_repository"] == "Admissible-Existence/.github"
          assert contract["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          assert contract["authority_effect"] == "NONE_CONTRACT_ONLY"
          assert contract["disposition_role"] == "TRANSITION_EVIDENCE_ONLY"
          assert contract["time_constraint"] == "CONSTRAINT_VARIABLE"
          location = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
          assert location["repository"] == contract["organization_ledger_repository"]
          assert location["ref"] == contract["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          print(location["namespace"])
          PY

      - name: Bind the designated organization ledger ref and the repository ledger subtree within it
        run: |
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="Admissible-Existence/.github", c; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "repository ledger subtree: $namespace"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it at genesis"
          fi

      - name: Read the committed request and gate its supplied epoch
        id: request
        # Absent hb_epoch is HB_EPOCH_NOT_SUPPLIED and an invalid one
        # HB_EPOCH_INVALID (six fields, exit 1) before anything is appended.
        run: python scripts/read_committed_request.py --request data/requests/organization-ledger-transition.json --require communication_id

      - name: Append repo and organization receipts for the diagnostic self-closure
        env:
          COMMUNICATION_ID: ${{ steps.request.outputs.communication_id }}
          HB_EPOCH: ${{ steps.request.outputs.hb_epoch }}
          REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          STEGVERSE_COMMITTED_REQUEST_PATH: data/requests/organization-ledger-transition.json
          STEGVERSE_COMMITTED_REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          echo "committed request sha256 $REQUEST_SHA256 at $GITHUB_SHA"
          python resident-runtime/intr_destination_ingress.py --self-close \
            --communication-id "$COMMUNICATION_ID" --hb-epoch "$HB_EPOCH" \
            --packet-id "intr-destination-self-closure:$COMMUNICATION_ID:request-sha256:$REQUEST_SHA256" \
            --out "$RUNNER_TEMP/results/closure.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_NOT_MATERIALIZED","failed_predicate":"SELF_CLOSURE_APPENDED_TO_THE_DESIGNATED_REF","required_evidence_or_repair":"the self-closure did not publish a local ledger ref","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ADMISSIBLE-EXISTENCE-ORGANIZATION-LEDGER","next_attempt":"commit the request again; nothing was published","authority_effect":"NONE_REFUSAL_ONLY","routing_authority_constraint":"CONSTRAINT_VARIABLE","time_constraint":"CONSTRAINT_VARIABLE","disposition_role":"TRANSITION_EVIDENCE_ONLY"}'
            exit 1
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ADMISSIBLE-EXISTENCE-ORGANIZATION-LEDGER","next_attempt":"commit the request again; a self-closure whose communication_id is already in the chain is answered from the ledger","authority_effect":"NONE_REFUSAL_ONLY","routing_authority_constraint":"CONSTRAINT_VARIABLE","time_constraint":"CONSTRAINT_VARIABLE","disposition_role":"TRANSITION_EVIDENCE_ONLY"}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_FETCH_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_A_CHECKOUT_HEADER","required_evidence_or_repair":"checkout token header unavailable for an independent fetch of the ledger ref","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ADMISSIBLE-EXISTENCE-ORGANIZATION-LEDGER","next_attempt":"commit the request again with a contents token that can fetch the ref","authority_effect":"NONE_READBACK_ONLY","routing_authority_constraint":"CONSTRAINT_VARIABLE","time_constraint":"CONSTRAINT_VARIABLE","disposition_role":"TRANSITION_EVIDENCE_ONLY"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/organization_ledger_readback.py \
            --location "git+$fresh#$LEDGER_REF" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --closure-result "$RUNNER_TEMP/results/closure.json" \
            --out "$RUNNER_TEMP/results/readback.json"
          {
            echo '### organization ledger readback'
            echo '```json'
            cat "$RUNNER_TEMP/results/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
