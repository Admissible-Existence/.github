name: Canonical Formalism Orientation Validation

on:
  pull_request:
    paths:
      - "docs/CANONICAL_FORMALISM_ORIENTATION.md"
      - "docs/DISCOVERY_FRONTIER.md"
      - "docs/RELATIONAL_ADMISSIBILITY_FORMALISM.md"
      - "docs/MINIMUM_ADMISSIBLE_TRANSITION_SET.md"
      - "docs/external-formalisms/**"
      - "data/canonical-formalism-orientation.json"
      - "data/canonical-formalism-orientation-claim.json"
      - "data/relational-admissibility-formalism.json"
      - "data/relational-admissibility-minimum-set-claim.json"
      - "data/external-formalisms/**"
      - "data/formalism-task-claims.json"
      - "schemas/relational-admissibility-transition.schema.json"
      - "fixtures/relational-admissibility/**"
      - "fixtures/external-formalisms/**"
      - "scripts/validate_canonical_formalism_orientation.py"
      - "scripts/validate_relational_admissibility_formalism.py"
      - "scripts/validate_minimum_admissible_transition_set.py"
      - "scripts/validate_verfi_external_formalism.py"
      - "tests/test_canonical_formalism_orientation.py"
      - "tests/test_relational_admissibility_formalism.py"
      - "tests/test_minimum_admissible_transition_set.py"
      - "tests/test_verfi_external_formalism.py"
      - "docs/PRINCIPLE_COMPLETENESS_MIRROR_HANDOFF.md"
      - "FORMALISM_MIRROR_HANDOFF.md"
      - ".github/workflows/canonical-formalism-orientation.yml"
  push:
    branches: [main]
    paths:
      - "docs/CANONICAL_FORMALISM_ORIENTATION.md"
      - "docs/DISCOVERY_FRONTIER.md"
      - "docs/RELATIONAL_ADMISSIBILITY_FORMALISM.md"
      - "docs/MINIMUM_ADMISSIBLE_TRANSITION_SET.md"
      - "docs/external-formalisms/**"
      - "data/canonical-formalism-orientation.json"
      - "data/canonical-formalism-orientation-claim.json"
      - "data/relational-admissibility-formalism.json"
      - "data/relational-admissibility-minimum-set-claim.json"
      - "data/external-formalisms/**"
      - "data/formalism-task-claims.json"
      - "schemas/relational-admissibility-transition.schema.json"
      - "fixtures/relational-admissibility/**"
      - "fixtures/external-formalisms/**"
      - "scripts/validate_canonical_formalism_orientation.py"
      - "scripts/validate_relational_admissibility_formalism.py"
      - "scripts/validate_minimum_admissible_transition_set.py"
      - "scripts/validate_verfi_external_formalism.py"
      - "tests/test_canonical_formalism_orientation.py"
      - "tests/test_relational_admissibility_formalism.py"
      - "tests/test_minimum_admissible_transition_set.py"
      - "tests/test_verfi_external_formalism.py"
      - "docs/PRINCIPLE_COMPLETENESS_MIRROR_HANDOFF.md"
      - "FORMALISM_MIRROR_HANDOFF.md"
      - ".github/workflows/canonical-formalism-orientation.yml"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      STEGVERSE_GITHUB_TOKEN: ""
      TVC_TOKEN: ""
    steps:
      - name: Anonymous source acquisition without credential authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          test -z "${STEGVERSE_GITHUB_TOKEN:-}"
          test -z "${TVC_TOKEN:-}"
          git -c credential.helper= -c http.extraHeader= init .
          git -c credential.helper= -c http.extraHeader= remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c http.extraHeader= fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Parse canonical orientation registry
        run: python -m json.tool data/canonical-formalism-orientation.json >/dev/null

      - name: Validate canonical orientation and authority boundaries
        run: python scripts/validate_canonical_formalism_orientation.py

      - name: Run orientation regression tests
        run: python -m unittest tests.test_canonical_formalism_orientation -v

      - name: Parse relational admissibility contract and fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/relational-admissibility-formalism.json >/dev/null
          python -m json.tool schemas/relational-admissibility-transition.schema.json >/dev/null
          python -m json.tool fixtures/relational-admissibility/cases.json >/dev/null

      - name: Validate relational admissibility successor-state contract
        run: python scripts/validate_relational_admissibility_formalism.py

      - name: Run relational admissibility regression tests
        run: python -m unittest tests.test_relational_admissibility_formalism -v

      - name: Validate minimum admissible transition set
        run: python scripts/validate_minimum_admissible_transition_set.py

      - name: Run minimum-set regression tests
        run: python -m unittest tests.test_minimum_admissible_transition_set -v

      - name: Parse VerFi external formalism candidate and governance lanes
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool data/external-formalisms/verfi.json >/dev/null
          python -m json.tool fixtures/external-formalisms/verfi-governance-lanes.json >/dev/null

      - name: Validate VerFi external formalism boundary and lanes
        run: python scripts/validate_verfi_external_formalism.py

      - name: Run VerFi external-formalism regression tests
        run: python -m unittest tests.test_verfi_external_formalism -v

      - name: Prove workflow is validation-only
        shell: bash
        run: |
          set -euo pipefail
          echo "credential_authority=TV/TVC"
          echo "github_token_runtime_authority=NONE"
          echo "workflow_authority_effect=NONE_VALIDATION_ONLY"
          echo "source_formalism_authority=false"
          echo "execution_authority=false"
          echo "publication_authority=false"
          echo "release_authority=false"
          echo "admissibility_resolver=Admissible-Existence/AE"
