name: Validate Workflow Triggers

# B-P40 (lead ruling R-DISPATCH): no workflow starts by a manual dispatch or a
# clock. A committed change to any workflow, to the trigger test or to the
# node-ingress contract re-runs the guard; nothing here is dispatched or
# scheduled.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/test_workflow_triggers.py"
      - "tests/test_workflow_action_pins.py"
      - "tests/test_committed_request.py"
      - "scripts/read_committed_request.py"
      - "docs/CANONICAL_NODE_INGRESS_CONTRACT_001.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/test_workflow_triggers.py"
      - "tests/test_workflow_action_pins.py"
      - "tests/test_committed_request.py"
      - "scripts/read_committed_request.py"
      - "docs/CANONICAL_NODE_INGRESS_CONTRACT_001.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: No workflow starts by manual dispatch or a clock; every action is pinned; the committed-request gate holds
        run: python -m unittest tests.test_workflow_triggers tests.test_workflow_action_pins tests.test_committed_request -v
      - name: The node-ingress contract stays valid and marks the observed host non-normative
        run: |
          python - <<'PY'
          import json
          contract = json.load(open("docs/CANONICAL_NODE_INGRESS_CONTRACT_001.json", encoding="utf-8"))
          ingress = contract["canonical_ingress"]
          assert ingress["host_is_authority"] is False
          assert ingress["currently_observed_discovery_host_is_canonical"] is False
          assert ingress["currently_observed_discovery_host_normative"] is False
          print("CANONICAL_NODE_INGRESS_HOST_NON_NORMATIVE")
          PY
