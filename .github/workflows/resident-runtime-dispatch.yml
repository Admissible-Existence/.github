name: Resident Runtime Dispatch

# The in-tree dispatcher for the entrypoints resident-runtime/activation-manifest.json
# declares. It supplies hb_epoch to one entrypoint and invokes it; it carries no
# authority (authority_effect NONE). Each entrypoint keeps its own refusal
# logic. A GitHub-hosted runner is an external machine, so a run here is CI
# evidence, not the runtime substrate.
#
# B-P40 (lead ruling R-DISPATCH, COMMITTED_REQUEST): a push to main that
# commits data/requests/resident-runtime-dispatch.json (entrypoint, hb_epoch,
# and ingress for run_once) is the only start. There are no inputs and no
# clock; the request is gated before anything is invoked.
on:
  push:
    branches: [main]
    paths:
      - "data/requests/resident-runtime-dispatch.json"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The request and its epoch are checked by the kernel's shared rule before
      # anything is invoked; an unusable request, or an absent or invalid
      # epoch, fails closed with six fields.
      - name: Read the committed request and gate its supplied epoch
        id: request
        run: >-
          python scripts/read_committed_request.py --request data/requests/resident-runtime-dispatch.json
          --choice entrypoint=federation_cycle,ecosystem_control_status,run_once --optional-text ingress
      - name: Invoke the declared entrypoint
        env:
          ENTRYPOINT: ${{ steps.request.outputs.entrypoint }}
          HB_EPOCH: ${{ steps.request.outputs.hb_epoch }}
          INGRESS: ${{ steps.request.outputs.ingress }}
          STEGVERSE_COMMITTED_REQUEST_PATH: data/requests/resident-runtime-dispatch.json
          STEGVERSE_COMMITTED_REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          # Every declared entrypoint is EPOCH_REQUIRED (activation-manifest.json
          # dispatcher.entrypoints): each stamps what it writes at this epoch.
          case "$ENTRYPOINT" in
            federation_cycle)
              python resident-runtime/federation_cycle.py --hb-epoch "$HB_EPOCH"
              ;;
            ecosystem_control_status)
              python resident-runtime/ecosystem_control.py --hb-epoch "$HB_EPOCH" status
              ;;
            run_once)
              if [ -z "${INGRESS:-}" ]; then echo "run_once requires ingress in the committed request"; exit 1; fi
              python resident-runtime/run_once.py --ingress "$INGRESS" --egress "$RUNNER_TEMP/egress.json" --hb-epoch "$HB_EPOCH"
              ;;
          esac
