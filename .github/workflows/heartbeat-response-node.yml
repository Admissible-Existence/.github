name: Heartbeat Response Node

# B-P40 (lead ruling R-DISPATCH): the node runs once per committed transition,
# a push to main that changes its configuration, script, tests or this file.
# It is not dispatched by hand and no clock polls the outbox. A committed
# epoch request (COMMITTED_REQUEST) lands with the node's --hb-epoch support
# (Admissible-Existence/.github#97).
on:
  push:
    branches: [main]
    paths:
      - "data/heartbeat-response-node.json"
      - "scripts/process_heartbeat_response.py"
      - "tests/test_heartbeat_response.py"
      - ".github/workflows/heartbeat-response-node.yml"

permissions:
  contents: write

concurrency:
  group: heartbeat-response-node
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test node semantics
        run: python -m unittest tests.test_heartbeat_response -v
      - name: Receive and classify canonical heartbeat
        run: |
          python scripts/process_heartbeat_response.py --apply
          python scripts/process_heartbeat_response.py --check
      - name: Persist new response receipts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/heartbeat-response-receipts)" ]; then
            echo "Heartbeat receipts already current"
            exit 0
          fi
          git config user.name "stegverse-heartbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat-response-receipts
          git commit -m "chore(heartbeat): persist received and responded receipts"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload node receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heartbeat-response-receipts
          path: data/heartbeat-response-receipts/
          if-no-files-found: error
