name: Heartbeat Response Node

on:
  workflow_dispatch:
    inputs:
      hb_epoch:
        description: "supplied heartbeat epoch (ASCII digits >= 32); new receipts are refused without one"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "data/heartbeat-response-node.json"
      - "scripts/process_heartbeat_response.py"
      - "tests/test_heartbeat_response.py"
      - ".github/workflows/heartbeat-response-node.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: heartbeat-response-node
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test node semantics
        run: python -m unittest tests.test_heartbeat_response -v
      - name: Receive and classify canonical heartbeat
        env:
          HB_EPOCH: ${{ inputs.hb_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          # Receipts reference a supplied epoch. Only a dispatch carries one
          # (input hb_epoch); a scheduled or push run has no epoch binding, so
          # it checks the node and writes nothing.
          if [ -n "${HB_EPOCH:-}" ]; then
            python scripts/process_heartbeat_response.py --apply --hb-epoch "$HB_EPOCH"
          else
            echo "HB_EPOCH_NOT_SUPPLIED: no hb_epoch input on this ${GITHUB_EVENT_NAME} run; receipts are written only by a dispatch that supplies one"
          fi
          python scripts/process_heartbeat_response.py --check
      - name: Persist new response receipts
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/heartbeat-response-receipts)" ]; then
            echo "Heartbeat receipts already current"
            exit 0
          fi
          git config user.name "stegverse-heartbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heartbeat-response-receipts
          git commit -m "chore(heartbeat): persist received and responded receipts"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload node receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heartbeat-response-receipts
          path: data/heartbeat-response-receipts/
          if-no-files-found: error
