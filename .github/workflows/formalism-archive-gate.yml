name: Formalism Archive Gate

on:
  push:
    paths:
      - "FORMALISM_MIRROR_HANDOFF.md"
      - "data/formalism-archive-transfer-registry.json"
      - "tools/check_formalism_archive_gate.py"
      - ".github/workflows/formalism-archive-gate.yml"
  pull_request:
    paths:
      - "FORMALISM_MIRROR_HANDOFF.md"
      - "data/formalism-archive-transfer-registry.json"
      - "tools/check_formalism_archive_gate.py"
      - ".github/workflows/formalism-archive-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-archive-transfer-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate formalism archive gate
        run: python tools/check_formalism_archive_gate.py

# Hosted-proof probe: bounded no-op change used to obtain pull-request validation evidence.
