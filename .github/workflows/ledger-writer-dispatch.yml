name: Ledger Writer Dispatch

# The in-tree dispatcher for the epoch-requiring ledger writers that
# resident-runtime/activation-manifest.json binds to it. It supplies hb_epoch
# and invokes one writer; it carries no authority (authority_effect NONE). The
# epoch is checked before anything runs. A GitHub-hosted runner is an external
# machine, so a run here is CI evidence, not the runtime substrate.
#
# B-P40 (lead ruling R-DISPATCH, COMMITTED_REQUEST): a push to main that
# commits data/requests/ledger-writer-dispatch.json (writer, hb_epoch, and
# optionally arguments, repo_ledger_root, org_ledger_root) is the only start.
# There are no inputs and no clock; the request is gated before any writer runs.
on:
  push:
    branches: [main]
    paths:
      - "data/requests/ledger-writer-dispatch.json"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read the committed request and gate its supplied epoch
        id: request
        run: >-
          python scripts/read_committed_request.py --request data/requests/ledger-writer-dispatch.json
          --choice writer=repository-ledger-emit,organization-ledger-aggregate,organization-egress,intr-destination-ingress
          --optional-text arguments --optional-text repo_ledger_root --optional-text org_ledger_root
      - name: Invoke the ledger writer
        env:
          WRITER: ${{ steps.request.outputs.writer }}
          HB_EPOCH: ${{ steps.request.outputs.hb_epoch }}
          ARGUMENTS: ${{ steps.request.outputs.arguments }}
          REPO_LEDGER_ROOT: ${{ steps.request.outputs.repo_ledger_root }}
          ORG_LEDGER_ROOT: ${{ steps.request.outputs.org_ledger_root }}
        shell: bash
        run: |
          set -euo pipefail
          export STEGVERSE_REPO_LEDGER_ROOT="${REPO_LEDGER_ROOT:-$RUNNER_TEMP/repo-ledger}"
          export STEGVERSE_ORG_LEDGER_ROOT="${ORG_LEDGER_ROOT:-$RUNNER_TEMP/org-ledger}"
          # The dispatcher checks the epoch first: an empty or invalid one is
          # the six-field FAIL_CLOSED and no writer is invoked.
          python scripts/dispatch_ledger_writer.py --writer "$WRITER" --hb-epoch "$HB_EPOCH" --arguments "$ARGUMENTS"
