name: Ledger Writer Dispatch

# The in-tree dispatcher for the epoch-requiring ledger writers that
# resident-runtime/activation-manifest.json binds to it. It supplies hb_epoch
# and invokes one writer; it carries no authority (authority_effect NONE). The
# epoch is checked before anything runs. A GitHub-hosted runner is an external
# machine, so a run here is CI evidence, not the runtime substrate.
on:
  workflow_dispatch:
    inputs:
      writer:
        description: "epoch-requiring ledger writer to invoke"
        required: true
        type: choice
        options:
          - repository-ledger-emit
          - organization-ledger-aggregate
          - organization-egress
          - intr-destination-ingress
      hb_epoch:
        description: "supplied heartbeat epoch (ASCII digits >= 32); the run fails closed without one"
        required: true
        type: string
      arguments:
        description: "the writer's own arguments, without --hb-epoch"
        required: false
        type: string
      repo_ledger_root:
        description: "repository ledger location (a path or git+<repository>#<ref>); defaults to the runner's temp"
        required: false
        type: string
      org_ledger_root:
        description: "organization ledger location (a path or git+<repository>#<ref>); defaults to the runner's temp"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Invoke the ledger writer
        env:
          WRITER: ${{ inputs.writer }}
          HB_EPOCH: ${{ inputs.hb_epoch }}
          ARGUMENTS: ${{ inputs.arguments }}
          REPO_LEDGER_ROOT: ${{ inputs.repo_ledger_root }}
          ORG_LEDGER_ROOT: ${{ inputs.org_ledger_root }}
        shell: bash
        run: |
          set -euo pipefail
          export STEGVERSE_REPO_LEDGER_ROOT="${REPO_LEDGER_ROOT:-$RUNNER_TEMP/repo-ledger}"
          export STEGVERSE_ORG_LEDGER_ROOT="${ORG_LEDGER_ROOT:-$RUNNER_TEMP/org-ledger}"
          # The dispatcher checks the epoch first: an empty or invalid one is
          # the six-field FAIL_CLOSED and no writer is invoked.
          python scripts/dispatch_ledger_writer.py --writer "$WRITER" --hb-epoch "$HB_EPOCH" --arguments "$ARGUMENTS"
