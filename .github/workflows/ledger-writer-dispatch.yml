name: Ledger Writer Dispatch

# The in-tree dispatcher for the epoch-requiring ledger writers that
# resident-runtime/activation-manifest.json binds to it. It supplies hb_epoch
# and invokes one writer; it carries no authority (authority_effect NONE). The
# epoch is checked before anything runs. A GitHub-hosted runner is an external
# machine, so a run here is CI evidence, not the runtime substrate.
#
# B-P40 (lead ruling R-DISPATCH, COMMITTED_REQUEST): a push to main that
# commits data/requests/ledger-writer-dispatch.json (writer, hb_epoch, and
# optionally arguments and source_committed_request, the
# digest of the request that produced an aggregate's source receipt) is the
# only start. There are no inputs and no clock; the request is gated before
# any writer runs. A request cannot choose either ledger: both are this run's
# own runner-temp roots (repo_ledger_root and org_ledger_root are refused).
on:
  push:
    branches: [main]
    paths:
      - "data/requests/ledger-writer-dispatch.json"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # A named source_committed_request resolves only against the request's
          # committed history, so the whole history is checked out.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read the committed request and gate its supplied epoch
        id: request
        run: >-
          python scripts/read_committed_request.py --request data/requests/ledger-writer-dispatch.json
          --choice writer=repository-ledger-emit,organization-ledger-aggregate,organization-egress,intr-destination-ingress
          --optional-text arguments --optional-digest source_committed_request
          --forbid repo_ledger_root --forbid org_ledger_root
      - name: Invoke the ledger writer
        env:
          WRITER: ${{ steps.request.outputs.writer }}
          HB_EPOCH: ${{ steps.request.outputs.hb_epoch }}
          ARGUMENTS: ${{ steps.request.outputs.arguments }}
          STEGVERSE_COMMITTED_REQUEST_PATH: data/requests/ledger-writer-dispatch.json
          STEGVERSE_COMMITTED_REQUEST_SHA256: ${{ steps.request.outputs.request_sha256 }}
          STEGVERSE_SOURCE_COMMITTED_REQUEST_SHA256: ${{ steps.request.outputs.source_committed_request }}
        shell: bash
        run: |
          set -euo pipefail
          # Neither ledger is a request's choice: the pair is this run's own untracked
          # runner-temp roots (a harness redirection the organization writer accepts).
          export STEGVERSE_ORG_LEDGER_ROOT="$RUNNER_TEMP/org-ledger"
          export STEGVERSE_REPO_LEDGER_ROOT="$RUNNER_TEMP/repo-ledger"
          # The dispatcher checks the epoch first: an empty or invalid one is
          # the six-field FAIL_CLOSED and no writer is invoked.
          python scripts/dispatch_ledger_writer.py --writer "$WRITER" --hb-epoch "$HB_EPOCH" --arguments "$ARGUMENTS"
