name: Principle worker activation observer

on:
  workflow_run:
    workflows:
      - "Principle completeness repository workers"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/observe_principle_worker_activation.py"
      - ".github/workflows/principle-worker-activation-observer.yml"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: principle-worker-activation-observer
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coordination repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Observe worker activation evidence
        id: observe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile scripts/observe_principle_worker_activation.py
          python scripts/observe_principle_worker_activation.py

      - name: Read observation state
        id: state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('reports/principle-worker-activation-observation.json').read_text())
          with Path(__import__('os').environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write(f"state={value['state']}\n")
              stream.write(f"next_action={value['next_action']}\n")
          PY

      - name: Upload sanitized observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: principle-worker-activation-observation
          path: reports/principle-worker-activation-observation.json
          if-no-files-found: error

      - name: Report observation to coordination issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 4 --repo Admissible-Existence/.github --body "### Principle worker activation observer\n\nState: \`${{ steps.state.outputs.state }}\`\n\nNext action: ${{ steps.state.outputs.next_action }}\n\nObserver run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nNo credential or protected value was read or recorded."

      - name: Fail closed until read-only evidence is complete
        if: steps.state.outputs.state != 'COMPLETE_READ_ONLY_WORKER_EVIDENCE'
        run: exit 1
