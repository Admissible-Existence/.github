parallel_build_policy:
  can_build_in_parallel: true
  preferred_method: batch_bootstrap_by_wave
  wave_1:
    - IW
    - BC
    - RE
    - STCM
  wave_2:
    - DC
    - DaCo
    - CHF
    - TT
  wave_3:
    - GCAT-BCAT
    - ECAT-ICAT
    - Triad
    - Existence
  wave_4:
    - validator
    - tracker
    - telemetry
    - ae-validation-factory
    - RTG
    - learning-transition-governance

parallel_rules:
  one_registry_per_repo: true
  one_dispatcher_per_repo: true
  one_workflow_per_repo: true
  no_cross_repo_release_claim_until_repo_receipt: true
  org_matrix_updates_after_each_wave: true

limits:
  no_authority_claim: true
  no_repo_open: true
  no_merge: true
  no_deploy: true
